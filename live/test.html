<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Live test panel</title>
<style>
  body { font: 14px Arial, sans-serif; background: #12121a; color: #eee; margin: 24px; max-width: 760px; }
  fieldset { border: 1px solid #444; margin: 0 0 16px; padding: 12px 16px; }
  input { padding: 6px; margin: 2px 4px 2px 0; background: #1f1f2b; color: #fff; border: 1px solid #555; }
  button { padding: 6px 12px; margin: 2px; cursor: pointer; }
  pre { background: #1f1f2b; padding: 10px; overflow: auto; max-height: 260px; }
</style>
</head>
<body>
<h2>Live test panel</h2>
<p>Open <a style="color:#7bf" href="/?live=1" target="_blank">/?live=1</a> in another tab (that is what OBS shows), then use these buttons.</p>

<fieldset><legend>Fake YouTube comment</legend>
  <input id="ca" value="Rahul" size="12"> <input id="ct" value="kitna level jayega ye bot?" size="40">
  <label><input type="checkbox" id="cm"> member</label> <button onclick="comment()">Send</button>
</fieldset>

<fieldset><legend>Fake payment (shows name on screen + voice shout-out)</legend>
  <input id="dn" value="Priya" size="12"> <input id="da" value="101" size="6"> <input id="dm" value="Keep going!" size="24">
  <button onclick="donate()">Send</button>
  <button onclick="donate(51)">51</button><button onclick="donate(201)">201</button><button onclick="donate(501)">501</button>
</fieldset>

<fieldset><legend>Fake game events</legend>
  <button onclick="game('level_start',{boss:false})">level start</button>
  <button onclick="game('level_start',{boss:true})">boss start</button>
  <button onclick="game('level_clear',{first:true})">clear (first try)</button>
  <button onclick="game('died')">died</button>
  <button onclick="game('fireball')">fireball</button>
  <button onclick="game('combo',{n:30})">combo 30</button>
  <button onclick="game('checkpoint',{pct:75})">75% (exciting)</button>
</fieldset>

<fieldset><legend>Support ask</legend>
  <button onclick="post('/mock/promo', {})">Say a support line + show red UPI popup now</button>
</fieldset>

<h3>State</h3><pre id="st">...</pre>
<script>
  const post = (p, b) => fetch(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
  const v = (id) => document.getElementById(id).value;
  const comment = () => post('/mock/comment', { author: v('ca'), text: v('ct'), member: document.getElementById('cm').checked });
  const donate = (a) => post('/mock/donation', { name: v('dn'), amount: a || Number(v('da')), message: v('dm') });
  const game = (type, extra) => post('/mock/game', Object.assign({ type, level: 7, attempt: 2, score: 412, bestLevel: 8, gems: 30, n: 7 }, extra));
  setInterval(() => fetch('/state').then((r) => r.json()).then((j) => { document.getElementById('st').textContent = JSON.stringify(j, null, 2); }), 2000);
</script>
</body>
</html>
